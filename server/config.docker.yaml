# Horus SIEM Server Configuration — Docker
# This config is copied as config.yaml inside the container.
# Main difference: redis.host = "redis" (Docker service name)

server:
  host: "0.0.0.0"
  port: 5001
  enrollment_port: 5000
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:3001"
    - "http://dashboard:3000"

redis:
  host: "redis"
  port: 6379
  db: 0
  event_queue_key: "horus:events"
  max_queue_size: 10000

auth:
  # Override por entorno: HORUS_PSK
  psk: "horus-default-psk"
  # Override por entorno: HORUS_REQUIRE_AGENT_PSK
  require_agent_psk: true

analysis:
  rules_path: "./rules/default_rules.yaml"
  mitre_map_path: "./data/mitre_map.json"

storage:
  alerts_db_path: "./data/alerts.db"
  cold_storage_path: "./data/cold_storage"
  cold_storage_retention_days: 90

workers:
  count: 2
  batch_size: 10

# ---------------------------------------------------------------------------
# Firebase Cloud Messaging (Push Notifications)
# ---------------------------------------------------------------------------
# TODO (dev-mobile): En Docker, monta el serviceAccountKey.json como volumen:
#   volumes:
#     - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
# Luego cambia enabled a true y pon tu project_id real.
firebase:
  enabled: false
  service_account_key: "./serviceAccountKey.json"
  project_id: "YOUR_FIREBASE_PROJECT_ID"

push:
  min_level: 8
  platforms:
    - android
  notification_title: "⚠️ Alerta Horus [{level}]"
  notification_body: "{rule_name} — Agente: {agent_id}"
